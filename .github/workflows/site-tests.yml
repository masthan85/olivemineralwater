name: Test the live site

# Runs the Playwright tests in tests/e2e against olivemineralwater.co.uk:
# after each push to main (once WordPress.com has deployed the plugin),
# every morning, and on demand from the Actions tab.
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test"
        default: "https://olivemineralwater.co.uk"

concurrency:
  group: site-tests
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || 'https://olivemineralwater.co.uk' }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install Playwright
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Wait for the plugin to deploy
      if: github.event_name == 'push'
      run: sleep 240

    - name: Run the tests
      run: npx playwright test

    - name: Keep the report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
