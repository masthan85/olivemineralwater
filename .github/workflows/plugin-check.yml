name: Check the WordPress plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use PHP 8.1
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Check PHP syntax
      run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

    - name: Check the plugin header
      run: grep -q '^ \* Plugin Name:' olive-site.php
